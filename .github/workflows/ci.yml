name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml

  extension-tests:
    uses: ./.github/workflows/extension-tests.yml
    secrets:
      TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
      TEST_GITHUB_USERNAME: ${{ secrets.TEST_GITHUB_USERNAME }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}

  status-check:
    needs: [ backend-tests, extension-tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.backend-tests.result }}" != "success" || "${{ needs.extension-tests.result }}" != "success" ]]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed"
